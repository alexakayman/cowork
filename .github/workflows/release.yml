name: Release

on:
  push:
    tags: ["v*"]

env:
  PNPM_VERSION: "9"
  NODE_VERSION: "22"

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install

      - name: Build Tauri app
        working-directory: apps/desktop
        run: pnpm tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: |
            apps/desktop/src-tauri/target/release/bundle/dmg/*.dmg
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz
            apps/desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig
            apps/desktop/src-tauri/target/release/bundle/macos/latest*.json
          if-no-files-found: error

  release:
    needs: [build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and rename artifacts
        run: |
          mkdir -p release
          find artifacts/macos -name '*.dmg' -exec cp {} release/Copaw-macos.dmg \;
          find artifacts/macos -name '*.app.tar.gz' -exec cp {} release/ \;
          find artifacts/macos -name '*.app.tar.gz.sig' -exec cp {} release/ \;
          find artifacts/macos -name 'latest*.json' -exec cp {} release/latest.json \;

      - name: Verify updater artifacts exist
        run: |
          echo "Release contents:"
          ls -la release/
          if [ ! -f release/latest.json ]; then
            echo "::error::latest.json not found — updater will not work. Ensure TAURI_SIGNING_PRIVATE_KEY secret is set."
            exit 1
          fi

      - name: Install dependencies
        run: pnpm install

      - name: Upload DMG to Vercel Blob (optional)
        id: blob
        continue-on-error: true
        run: |
          url=$(node scripts/upload-dmg-to-blob.mjs release/Copaw-macos.dmg)
          echo "url=$url" >> $GITHUB_OUTPUT
          echo "Download URL (set this as DOWNLOAD_URL in your Vercel project env): $url"
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: release/*
